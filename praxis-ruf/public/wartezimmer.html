<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wartezimmer-Anzeige</title>
<style>
  :root{
    --gruen-tief:#024629; --gruen-hell:#1d7a4c;
    --mint:#a9d9bf; --papier:#f2f7f4; --messing:#e0b458;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--gruen-tief);color:var(--papier);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;cursor:none
  }
  .rahmen{height:100%;display:grid;grid-template-rows:auto 1fr auto}

  .kopf{
    display:flex;align-items:center;justify-content:space-between;
    padding:2.2vh 3.5vw;font-size:clamp(13px,1.5vh,20px);
    letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:.75
  }
  .kopf b{font-weight:600}
  .uhr{font-variant-numeric:tabular-nums;letter-spacing:.08em}
  .puls{
    display:inline-block;width:.55em;height:.55em;border-radius:50%;
    background:var(--gruen-hell);margin-right:.6em
  }
  .puls.teil{background:#d8a63c}
  .puls.aus{background:#b4553f}

  .buehne{position:relative;display:grid;place-items:center;padding:0 4vw}

  .ruhe{text-align:center;animation:atmen 7s ease-in-out infinite}
  .ruhe .marke{font-size:clamp(22px,4.4vh,44px);font-weight:300;opacity:.92;line-height:1.25}
  .ruhe .hinweis{margin-top:2.6vh;font-size:clamp(14px,2.1vh,24px);color:var(--mint);opacity:.6;letter-spacing:.05em}
  .kranz{
    width:clamp(52px,7vh,90px);height:clamp(52px,7vh,90px);margin:0 auto 3.4vh;
    border:2px solid rgba(169,217,191,.35);border-radius:50%;display:grid;place-items:center
  }
  .kranz::after{
    content:"";width:38%;height:38%;border-radius:50%;
    background:linear-gradient(180deg,var(--mint) 0 50%,transparent 50% 100%);opacity:.55
  }
  @keyframes atmen{0%,100%{opacity:.82}50%{opacity:1}}

  .aufruf{display:none;width:100%;text-align:center}
  body.ruft .aufruf{display:block}
  body.ruft .ruhe{display:none}

  .eyebrow{
    font-size:clamp(13px,1.9vh,22px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--messing);margin-bottom:2.2vh;animation:einblenden .5s .05s both
  }
  .name{
    font-weight:700;line-height:1.02;letter-spacing:-.02em;
    font-size:clamp(44px,13.5vh,190px);word-break:break-word;
    animation:einblenden .55s .12s both
  }
  .name.lang{font-size:clamp(38px,9.5vh,132px)}
  .name.sehrlang{font-size:clamp(32px,7vh,96px)}

  .ziel{
    margin-top:4.2vh;display:flex;align-items:center;justify-content:center;gap:2.4vw;
    animation:einblenden .55s .3s both
  }
  .ziel .text{text-align:left;font-size:clamp(18px,3.4vh,42px);font-weight:300;color:var(--mint);line-height:1.2}
  .ziel .text small{display:block;font-size:.62em;opacity:.7;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.35em}

  .ring{position:relative;flex:0 0 auto;width:clamp(88px,17vh,210px);height:clamp(88px,17vh,210px);display:grid;place-items:center}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:clamp(3px,.55vh,7px) solid var(--messing);opacity:.9}
  .ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:clamp(3px,.55vh,7px) solid var(--messing);animation:welle 2.6s ease-out 3}
  .ring span{font-size:clamp(44px,9.6vh,124px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  @keyframes welle{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}
  @keyframes einblenden{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .verlauf{display:flex;border-top:1px solid rgba(169,217,191,.18);min-height:9vh;align-items:stretch}
  .verlauf .titel{
    padding:2.2vh 2.4vw;font-size:clamp(10px,1.25vh,15px);letter-spacing:.22em;
    text-transform:uppercase;color:var(--mint);opacity:.45;display:flex;align-items:center;white-space:nowrap
  }
  .verlauf ol{list-style:none;display:flex;flex:1;overflow:hidden}
  .verlauf li{
    flex:1;padding:2.2vh 1.6vw;border-left:1px solid rgba(169,217,191,.14);
    display:flex;flex-direction:column;justify-content:center;gap:.4em;
    font-size:clamp(12px,1.9vh,22px);opacity:.55;min-width:0
  }
  .verlauf li:first-child{opacity:.9}
  .verlauf li .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .verlauf li .s{font-size:.72em;color:var(--mint);letter-spacing:.06em}

  .freigabe{position:fixed;inset:0;background:var(--gruen-tief);z-index:50;display:grid;place-items:center;text-align:center;padding:6vw;cursor:pointer}
  .freigabe.weg{display:none}
  .freigabe h1{font-size:clamp(20px,3.6vh,38px);font-weight:300;margin-bottom:1.6vh}
  .freigabe p{color:var(--mint);opacity:.7;font-size:clamp(14px,2vh,20px);max-width:34ch;margin:0 auto 4vh}
  .freigabe button{
    font:inherit;font-size:clamp(16px,2.4vh,24px);background:var(--messing);color:#1a2b20;
    border:0;border-radius:999px;padding:1.1em 2.6em;font-weight:600;cursor:pointer
  }
  .freigabe button:focus-visible{outline:3px solid var(--papier);outline-offset:4px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="freigabe" id="freigabe">
  <div>
    <h1 id="freigabeTitel">Wartezimmer-Anzeige</h1>
    <p>Einmal antippen, damit der Lautsprecher die Aufrufe ansagen darf. Danach läuft die Anzeige von selbst.</p>
    <button id="startKnopf">Anzeige starten</button>
  </div>
</div>

<div class="rahmen">
  <header class="kopf">
    <div><span class="puls aus" id="puls"></span><b id="raumName">Wartezimmer</b></div>
    <div class="uhr" id="uhr">--:--</div>
  </header>

  <main class="buehne">
    <section class="ruhe" id="ruhe">
      <div class="kranz"></div>
      <div class="marke" id="praxisName">Hausarztpraxis</div>
      <div class="hinweis">Bitte nehmen Sie Platz — Sie werden hier aufgerufen.</div>
    </section>

    <section class="aufruf" aria-live="assertive">
      <div class="eyebrow">Aufruf</div>
      <div class="name" id="nameFeld"></div>
      <div class="ziel">
        <div class="ring"><span id="ringZahl"></span></div>
        <div class="text"><small>Bitte in</small><span id="zielText"></span></div>
      </div>
    </section>
  </main>

  <footer class="verlauf">
    <div class="titel">Zuletzt aufgerufen</div>
    <ol id="verlaufListe"><li><span class="s">Noch keine Aufrufe</span></li></ol>
  </footer>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const params = new URLSearchParams(location.search);
  const raum = params.get('raum') || 'wz1';

  // Alle Sprechzimmer-PCs, denen dieser Bildschirm zuhört.
  // Beispiel:  ?quellen=192.168.178.41:8080,192.168.178.42:8080
  const quellen = (params.get('quellen') || location.host)
    .split(',').map(s => s.trim()).filter(Boolean)
    .map(s => (s.startsWith('http') ? s : 'http://' + s));

  // Läuft diese Seite auf einem dedizierten Bildschirm, ist Vollbild
  // erwünscht (Voreinstellung). Läuft sie stattdessen als kleines Fenster
  // auf einem PC, der auch für anderes benutzt wird (z. B. am Empfang),
  // würde Vollbild die Arbeit an diesem PC unterbrechen — dort mit
  // &vollbild=nein in der Adresse abschalten.
  const vollbild = !['nein', 'false', '0'].includes((params.get('vollbild') || '').toLowerCase());

  let konfig = null, stimme = null, tonFrei = false, audioCtx = null, ausblendTimer = null;
  let sageUhren = [];                 // laufende Uhren fuer Ansage und Wiederholung
  const verbindungen = new Map();     // Quelle -> verbunden ja/nein
  let verlauf = [];                   // nur im Arbeitsspeicher dieser Seite

  /* ---------- Uhr ---------- */
  const uhr = () => $('uhr').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  uhr(); setInterval(uhr, 15000);

  /* ---------- Konfiguration (von der eigenen Quelle) ---------- */
  fetch(quellen[0] + '/api/config').then(r => r.json()).then(c => {
    konfig = c;
    const wz = (c.wartezimmer || []).find(w => w.id === raum);
    const label = wz ? wz.name : raum;
    $('raumName').textContent = label;
    $('freigabeTitel').textContent = label;
    $('praxisName').textContent = c.praxis || 'Praxis';
    document.title = label + ' — Anzeige';
    stimmeWaehlen();
  }).catch(() => {});

  /* ---------- Sprachausgabe ---------- */
  function stimmeWaehlen() {
    const alle = speechSynthesis.getVoices();
    if (!alle.length) return;
    for (const w of ((konfig && konfig.stimme && konfig.stimme.bevorzugt) || [])) {
      const t = alle.find(v => v.name.toLowerCase().includes(w.toLowerCase()));
      if (t) { stimme = t; return; }
    }
    stimme = alle.find(v => v.lang === 'de-DE') || alle.find(v => v.lang.startsWith('de')) || null;
  }
  speechSynthesis.onvoiceschanged = stimmeWaehlen;

  function sprechen(text) {
    if (!tonFrei) return;
    const s = (konfig && konfig.stimme) || {};
    const u = new SpeechSynthesisUtterance(text);
    u.lang = s.sprache || 'de-DE';
    if (stimme) u.voice = stimme;
    u.rate = s.tempo || 0.88;
    u.pitch = s.tonhoehe || 1.0;
    u.volume = s.lautstaerke || 1.0;
    speechSynthesis.speak(u);
  }

  function gong() {
    if (!tonFrei || (konfig && konfig.gong === false)) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      for (const [hz, versatz] of [[784, 0], [1046.5, 0.16]]) {
        const t = audioCtx.currentTime + versatz;
        const osz = audioCtx.createOscillator(), amp = audioCtx.createGain();
        osz.type = 'sine'; osz.frequency.value = hz;
        amp.gain.setValueAtTime(0.0001, t);
        amp.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        osz.connect(amp).connect(audioCtx.destination);
        osz.start(t); osz.stop(t + 1.2);
      }
    } catch (e) {}
  }

  /* ---------- Weckton fuer Bluetooth-Lautsprecher ---------- */
  // Nutzt jemand statt eines festen Bildschirms den ohnehin vorhandenen
  // Empfangs-PC mit einem Bluetooth-Lautsprecher, legt sich die Funkstrecke
  // mancher Geraete nach einigen Minuten Stille schlafen — beim Aufwachen
  // fehlt dann die erste Silbe. Ein sehr leiser, tiefer Ton alle 60 Sekunden
  // haelt die Verbindung wach. Im Raum nicht zu hoeren, waehrend einer
  // laufenden Ansage schweigt er. Ueber config.json abschaltbar.
  let wachtonUhr = null;

  function wachtonSpielen() {
    if (!tonFrei || (konfig && konfig.wachton === false) || !audioCtx) return;
    if (speechSynthesis.speaking) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const osz = audioCtx.createOscillator(), amp = audioCtx.createGain();
      osz.type = 'sine';
      osz.frequency.value = (konfig && konfig.wachtonHertz) || 60;
      const staerke = Math.min(Math.max((konfig && konfig.wachtonStaerke) || 0.02, 0.001), 0.2);
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(staerke, t + 0.06);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      osz.connect(amp).connect(audioCtx.destination);
      osz.start(t);
      osz.stop(t + 0.55);
    } catch (e) {}
  }

  function wachtonStarten() {
    if (konfig && konfig.wachton === false) return;
    clearInterval(wachtonUhr);
    const abstand = Math.max(10, (konfig && konfig.wachtonSekunden) || 60) * 1000;
    wachtonUhr = setInterval(wachtonSpielen, abstand);
  }

  /* ---------- Aufruf ---------- */
  function aufrufZeigen(ev) {
    const voll = ((ev.anrede ? ev.anrede + ' ' : '') + ev.name).trim();
    const feld = $('nameFeld');
    feld.textContent = voll;
    feld.className = 'name' + (voll.length > 26 ? ' sehrlang' : voll.length > 15 ? ' lang' : '');
    $('zielText').textContent = ev.sprechzimmer;
    $('ringZahl').textContent = ev.sprechzimmerKurz || '';

    const ring = document.querySelector('.ring');
    ring.style.animation = 'none'; void ring.offsetWidth; ring.style.animation = '';
    document.body.classList.add('ruft');

    ansageAbbrechen();
    gong();
    const satz = voll + ', bitte in ' + ev.sprechzimmer + '.';
    sageUhren.push(setTimeout(() => sprechen(satz), 1250));
    if (ev.wiederholen !== false) sageUhren.push(setTimeout(() => sprechen(satz), 5200));

    verlauf.unshift({ voll, sprechzimmer: ev.sprechzimmer, ts: ev.ts || Date.now() });
    verlauf = verlauf.slice(0, 4);
    verlaufZeichnen();

    clearTimeout(ausblendTimer);
    ausblendTimer = setTimeout(() => document.body.classList.remove('ruft'),
      ((konfig && konfig.anzeigeDauerSekunden) || 45) * 1000);
  }

  // speechSynthesis.cancel() beendet nur, was gerade gesprochen wird. Ohne das
  // Loeschen der Uhren sagt der Lautsprecher nach einem neuen Aufruf noch einmal
  // den vorherigen Namen an.
  function ansageAbbrechen() {
    sageUhren.forEach(clearTimeout);
    sageUhren = [];
    speechSynthesis.cancel();
  }

  function verlaufZeichnen() {
    $('verlaufListe').innerHTML = verlauf.length ? verlauf.map(v => {
      const zeit = new Date(v.ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      return `<li><span class="n">${esc(v.voll)}</span><span class="s">${esc(v.sprechzimmer)} · ${zeit}</span></li>`;
    }).join('') : '<li><span class="s">Noch keine Aufrufe</span></li>';
  }

  function durchsage(url) {
    if (!tonFrei) return;
    ansageAbbrechen();
    new Audio(url).play().catch(() => {});
  }

  /* ---------- Verbindung zu allen Sprechzimmern ---------- */
  function pulsAktualisieren() {
    const gesamt = quellen.length;
    const offen = [...verbindungen.values()].filter(Boolean).length;
    const p = $('puls');
    p.className = 'puls' + (offen === 0 ? ' aus' : offen < gesamt ? ' teil' : '');
    p.title = offen + ' von ' + gesamt + ' Sprechzimmern verbunden';
  }

  function verbinden(quelle) {
    const q = new EventSource(quelle + '/api/events?raum=' + encodeURIComponent(raum));
    q.onopen = () => { verbindungen.set(quelle, true); pulsAktualisieren(); };
    q.onerror = () => {
      verbindungen.set(quelle, false); pulsAktualisieren();
      q.close(); setTimeout(() => verbinden(quelle), 4000);
    };
    q.onmessage = (e) => {
      let d; try { d = JSON.parse(e.data); } catch (_) { return; }
      if (d.type === 'aufruf')    aufrufZeigen(d);
      if (d.type === 'durchsage') durchsage(d.url);
      if (d.type === 'leeren')    { clearTimeout(ausblendTimer); ansageAbbrechen(); document.body.classList.remove('ruft'); }
    };
  }

  async function wachHalten() {
    try {
      if ('wakeLock' in navigator) {
        let sperre = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') {
            try { sperre = await navigator.wakeLock.request('screen'); } catch (e) {}
          }
        });
      }
    } catch (e) {}
  }

  $('startKnopf').addEventListener('click', async () => {
    tonFrei = true;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      const stumm = new SpeechSynthesisUtterance(' ');
      stumm.volume = 0; speechSynthesis.speak(stumm);
    } catch (e) {}
    $('freigabe').classList.add('weg');
    wachHalten();
    wachtonStarten();
    if (vollbild && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  quellen.forEach(q => { verbindungen.set(q, false); verbinden(q); });
  pulsAktualisieren();
})();
</script>
</body>
</html>
