<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16653f">
<title>Praxis-Kalender · Dr. med. Victoria Yar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Farben der Praxis-Website (Hausarztpraxis Dr. med. Victoria Yar) */
  --bg:#f6f9f7; --card:#fff; --line:#dde8e2; --ink:#0f1c14; --mut:#627a6d;
  --accent:#16653f; --accent-2:#1a7d4d; --accent-soft:#eaf5f0; --warn:#8a5a00; --bad:#a3231f;
  --we:#eef2ef; --ft:#fbf3e6;
  /* Keine externen Schriften: nichts verlaesst den Praxis-Server */
  --serif:'Cormorant Garamond',Lora,Georgia,'Times New Roman',serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:50;background:var(--accent);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-size:clamp(0.98rem,3.6vw,1.28rem);font-weight:600;letter-spacing:0.01em;line-height:1.15}
.top .sub{font-size:0.66rem;opacity:0.8;margin-top:1px}
.top .spacer{flex:1}
.yearpick{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.15);border-radius:9px;padding:2px}
.yearpick button{background:none;border:none;color:#fff;font-size:0.95rem;padding:4px 8px;cursor:pointer;border-radius:7px;font-family:inherit}
.yearpick button:active{background:rgba(255,255,255,0.2)}
.yearpick span{font-size:0.8rem;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.iconbtn{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:9px;padding:7px 10px;font-size:0.75rem;cursor:pointer;font-family:inherit;font-weight:600}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:40}
.tab{flex:0 0 auto;padding:14px 20px;font-size:0.92rem;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.wrap{flex:1;padding:14px;padding-bottom:96px;max-width:1500px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,28,20,0.04)}
.card h2{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--mut);margin-bottom:12px;font-weight:700}
label{display:block;font-size:0.68rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.row.one{grid-template-columns:1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row>div{min-width:0}
input[type=date]{min-width:0}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:0.92rem;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
.btn:active{opacity:0.85}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:#fee2e2;color:var(--bad)}
.btn.small{width:auto;padding:8px 13px;font-size:0.78rem;display:inline-block;margin-right:7px}
.muted{color:var(--mut);font-size:0.78rem;line-height:1.5}
.err{background:#fee2e2;color:var(--bad);padding:10px 12px;border-radius:10px;font-size:0.8rem;margin-bottom:11px}
.ok{background:var(--accent-soft);color:var(--accent);padding:10px 12px;border-radius:10px;font-size:0.8rem;margin-bottom:11px}
/* ---- Planer-Raster ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
table.plan{border-collapse:separate;border-spacing:0;font-size:0.7rem}
table.plan th,table.plan td{border-right:1px solid #eef1f4;border-bottom:1px solid #eef1f4}
table.plan thead th{position:sticky;top:0;background:#fff;z-index:2;font-weight:700;color:var(--mut);padding:4px 0;text-align:center;font-size:0.6rem;line-height:1.25}
table.plan th.nm{position:sticky;left:0;z-index:3;background:#fff;text-align:left;padding:7px 10px;min-width:118px;max-width:118px;font-size:0.72rem;color:var(--ink);box-shadow:1px 0 0 var(--line)}
table.plan thead th.nm{z-index:4}
td.d{width:26px;min-width:26px;height:30px;text-align:center;cursor:pointer;position:relative}
td.d.we{background:var(--we)}
td.d.frei{background:repeating-linear-gradient(135deg,#fff,#fff 3px,#e8efea 3px,#e8efea 6px)}
td.d.halbfrei::after{content:'';position:absolute;right:0;bottom:0;width:0;height:0;border-left:7px solid transparent;border-bottom:7px solid #d5dbe0}
td.d.ft{background:var(--ft)}
td.d.today{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
td.d .mark{position:absolute;inset:2px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.55rem;font-weight:700}
td.d .mark.half{clip-path:polygon(0 0,100% 0,0 100%)}
tr.sum td{height:22px;font-size:0.58rem;color:var(--mut);text-align:center;font-weight:700;background:#f4f8f5}
tr.sum td.low{background:#fee2e2;color:var(--bad)}
.mon-head th{font-size:0.58rem;color:var(--accent);background:#fff;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line)}
/* ---- Grosser Knopf unten rechts ---- */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--accent);color:#fff;border:none;border-radius:30px;padding:15px 22px;
  font-size:0.95rem;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 20px rgba(22,101,63,0.35)}
.fab:active{transform:scale(0.97)}
/* ---- Umschalter Monat/Jahr ---- */
.seg{display:inline-flex;background:var(--accent-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:9px 18px;border-radius:9px;font-size:0.84rem;
  font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff}
/* ---- Auswahl der Eintragsart ---- */
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.typegrid button{display:flex;align-items:center;gap:8px;padding:13px 12px;border:2px solid var(--line);
  border-radius:12px;background:#fff;font-size:0.86rem;font-weight:600;font-family:inherit;
  cursor:pointer;color:var(--ink);text-align:left}
.typegrid button i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:0 0 auto}
.typegrid button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
/* ---- Heute-Streifen ---- */
.heute{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);
  border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:0.84rem;color:var(--accent)}
.heute b{font-weight:700}
.heute .chip{background:#fff;border-radius:20px;padding:4px 11px;font-size:0.76rem;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px}
.heute .chip i{width:9px;height:9px;border-radius:50%}
/* ---- Antraege ---- */
.antrag{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.antrag:last-child{border-bottom:none}
.antrag .t{flex:1;min-width:150px;font-size:0.84rem}
.badge{background:var(--warn);color:#fff;border-radius:20px;padding:1px 8px;font-size:0.68rem;
  font-weight:700;margin-left:6px}
/* ---- Zugaenge ---- */
.zugang{display:block;font-size:0.7rem;color:var(--mut);margin-top:2px}
.item .t span{display:block}
.zugang b{color:var(--accent)}
/* ---- Nachweise ---- */
.datei{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;background:#fff}
.datei .ic{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex:0 0 auto}
.datei .n{flex:1;min-width:0}
.datei .n a{color:var(--ink);font-size:0.82rem;font-weight:600;text-decoration:none;word-break:break-all}
.datei .n a:hover{text-decoration:underline}
.datei .n span{display:block;font-size:0.67rem;color:var(--mut)}
.datei button{background:none;border:none;color:var(--mut);font-size:0.72rem;cursor:pointer;
  font-family:inherit;padding:4px 6px}
.datei button:hover{color:var(--bad)}
.upload{border:2px dashed var(--line);border-radius:12px;padding:13px;background:#fbfdfc}
.upload input[type=file]{border:none;padding:6px 0;font-size:0.82rem;background:none}
td.d .klammer{position:absolute;right:1px;top:1px;width:0;height:0;
  border-left:6px solid transparent;border-top:6px solid rgba(255,255,255,0.9);z-index:2}
/* ---- Hilfe ---- */
.hilfe{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;
  font-size:0.78rem;color:var(--mut);line-height:1.6;margin-top:12px}
/* ---- Legende ---- */
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:0.68rem;color:var(--mut)}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
/* ---- Konten ---- */
.konto{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.konto .kh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.konto .kh b{font-family:var(--serif);font-size:1.12rem;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px;margin-bottom:9px}
.kbox{background:#f7f9fa;border-radius:9px;padding:8px;text-align:center}
.kbox .v{font-family:var(--serif);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.kbox .l{font-size:0.56rem;color:var(--mut);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}
.kbox.rest .v{color:var(--accent)}
.kbox.rest.neg .v{color:var(--bad)}
.bar{height:7px;border-radius:4px;background:#e8ecef;overflow:hidden;display:flex;margin-bottom:7px}
.bar i{display:block;height:100%}
.flag{background:#fef3c7;color:var(--warn);border-radius:8px;padding:7px 10px;font-size:0.72rem;margin-top:7px;line-height:1.45}
/* ---- Liste ---- */
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{flex:1;min-width:0}
.item .t b{font-size:0.88rem;display:block;font-weight:600}
.item .t span{font-size:0.7rem;color:var(--mut)}
.pill{font-size:0.6rem;font-weight:700;color:#fff;padding:3px 8px;border-radius:20px;white-space:nowrap}
/* ---- Dialog ---- */
.ov{position:fixed;inset:0;background:rgba(15,23,32,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.dlg{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.dlg h3{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin-bottom:14px}
.wd{display:flex;gap:5px}
.wd button{flex:1;padding:9px 0;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:0.7rem;font-weight:700;cursor:pointer;font-family:inherit;color:var(--mut)}
.wd button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wd button.half{background:#b8d9c8;border-color:#b8d9c8;color:#0f1c14}
.center{max-width:400px;margin:8vh auto;padding:0 16px}
@media (min-width:760px){ .ov{align-items:center} .dlg{border-radius:18px} }
@media print{
  .top,.tabs,.noprint,.btn{display:none !important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .card{border:none;padding:0}
  .scroll{overflow:visible;border:none}
  td.d{width:19px;min-width:19px;height:20px}
  table.plan th.nm{min-width:96px;max-width:96px}
  @page{size:landscape;margin:8mm}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
'use strict';
var S = null;                       // Zustand vom Server
var JAHR = new Date().getFullYear();
var MONAT = new Date().getMonth();  // 0..11
var VIEW = 'monat';
var IDX = {};                       // staff_id -> { 'YYYY-MM-DD': eintrag }
var TY = {};                        // typ-key -> definition
var MSG = null;

var WTAG = ['Mo','Di','Mi','Do','Fr','Sa','So'];
var MNAME = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var MKURZ = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
var ROLLEN = {arzt:'Ärztin / Arzt', mfa:'MFA', azubi:'Auszubildende', verwaltung:'Verwaltung', sonstige:'Sonstige'};

// ------------------------------------------------------------------ Hilfen
function el(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dmy(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
/** "12.10.2026 – 16.10.2026" oder nur "12.10.2026" bei einem einzelnen Tag */
function zeitraum(von, bis){ return von === bis ? dmy(von) : dmy(von)+' – '+dmy(bis); }
function num(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function tage(n){ return num(n)+' '+(Math.abs(n)===1?'Tag':'Tage'); }

function api(a, data){
  var opt = {headers:{}, credentials:'same-origin'};
  if(data !== undefined){
    opt.method = 'POST';
    opt.headers['Content-Type'] = 'application/json';
    if(S && S.csrf) opt.headers['X-Praxis-Token'] = S.csrf;
    opt.body = JSON.stringify(data);
  }
  return fetch('api.php?a='+a, opt).then(function(r){
    return r.json().catch(function(){ return {error:'antwort_unlesbar'}; })
      .then(function(j){ if(j && j.error) throw j; return j; });
  });
}
function apiUpload(absenceId, art, datei){
  var fd = new FormData();
  fd.append('absence_id', absenceId);
  fd.append('art', art);
  fd.append('datei', datei);
  return fetch('api.php?a=upload', {
    method:'POST', credentials:'same-origin',
    headers: S && S.csrf ? {'X-Praxis-Token': S.csrf} : {},
    body: fd
  }).then(function(r){
    return r.json().catch(function(){ return {error:'antwort_unlesbar'}; })
      .then(function(j){ if(j && j.error) throw j; return j; });
  });
}
function mb(bytes){
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1048576) return Math.round(bytes/1024)+' KB';
  return (Math.round(bytes/104857.6)/10).toString().replace('.',',')+' MB';
}
function dateienVon(absenceId){
  return (S.dateien||[]).filter(function(f){ return f.absence_id === absenceId; });
}
function standardArt(typ){
  if(typ === 'krank') return 'au';
  if(typ === 'kind_krank') return 'au_kind';
  if(typ === 'fortbildung') return 'zertifikat';
  return 'sonstiges';
}

var FEHLER = {
  config_missing:'config.php fehlt auf dem Server.',
  db_connect:'Datenbank nicht erreichbar – Zugangsdaten in config.php prüfen.',
  login_falsch:'Benutzername oder Passwort stimmt nicht.',
  gesperrt:'Zu viele Fehlversuche. Bitte 5 Minuten warten.',
  nicht_angemeldet:'Sitzung abgelaufen – bitte neu anmelden.',
  passwort_zu_kurz:'Das Passwort braucht mindestens 10 Zeichen.',
  benutzername_zu_kurz:'Der Benutzername braucht mindestens 3 Zeichen.',
  datum_ungueltig:'Bitte gültige Daten eingeben.',
  bis_vor_von:'Das Enddatum liegt vor dem Startdatum.',
  csrf:'Sitzung abgelaufen – bitte Seite neu laden.',
  name_fehlt:'Bitte einen Namen eingeben.',
  dateityp:'Nur PDF und Bilder (JPG, PNG, HEIC, WEBP) sind erlaubt.',
  datei_zu_gross:'Die Datei ist zu groß. Bitte als PDF oder kleineres Foto hochladen.',
  keine_datei:'Es wurde keine Datei ausgewählt.',
  datei_leer:'Die Datei ist leer.',
  upload_fehlgeschlagen:'Das Hochladen hat nicht geklappt. Bitte noch einmal versuchen.',
  ordner_nicht_beschreibbar:'Der Ordner data/nachweise ist nicht beschreibbar (Rechte 775 setzen).',
  speichern_fehlgeschlagen:'Die Datei konnte auf dem Server nicht gespeichert werden.',
  eintrag_unbekannt:'Der Eintrag wurde nicht gefunden.',
  datei_unbekannt:'Der Nachweis wurde nicht gefunden.',
  benutzername_vergeben:'Diesen Benutzernamen gibt es schon.',
  benutzername_zeichen:'Nur Kleinbuchstaben, Ziffern, Punkt, Minus und Unterstrich.',
  letzte_leitung:'Das ist der letzte Zugang mit der Rolle Leitung – er kann nicht entfernt oder herabgestuft werden.',
  eigener_zugang:'Den eigenen Zugang können Sie nicht löschen.',
  zugang_deaktiviert:'Dieser Zugang ist gesperrt. Bitte an die Praxisleitung wenden.',
  kein_mitarbeiter_verknuepft:'Ihr Zugang ist noch keiner Person im Plan zugeordnet.',
  keine_berechtigung:'Dafür fehlt Ihnen die Berechtigung.'
};
function fehlerText(e){
  if(!e) return 'Unbekannter Fehler.';
  if(e.hinweis) return e.hinweis;
  return FEHLER[e.error] || ('Fehler: '+(e.error||e.message||e));
}
function zeige(text, gut){ MSG = {text:text, gut:!!gut}; render(); setTimeout(function(){
  if(MSG && MSG.text===text){ MSG=null; var b=el('msg'); if(b) b.remove(); } }, 4000); }

// ------------------------------------------------------------------ Laden
function load(){
  return api('state&jahr='+JAHR).then(function(d){
    S = d;
    if(S.typen){ TY = {}; S.typen.forEach(function(t){ TY[t.key]=t; }); }
    if(S.staff) buildIndex();
    render();
  }).catch(function(e){
    document.getElementById('root').innerHTML =
      '<div class="center"><div class="card"><h2>Fehler</h2><div class="err">'+esc(fehlerText(e))+'</div></div></div>';
  });
}
var HATDATEI = {};      // absence_id -> Anzahl Nachweise
function buildIndex(){
  IDX = {};
  HATDATEI = {};
  (S.dateien||[]).forEach(function(f){ HATDATEI[f.absence_id] = (HATDATEI[f.absence_id]||0) + 1; });
  S.staff.forEach(function(m){ IDX[m.id] = {}; });
  S.absences.forEach(function(a){
    if(a.status==='abgelehnt' || a.status==='storniert') return;
    if(!IDX[a.staff_id]) return;
    var d = new Date(a.von+'T12:00:00'), e = new Date(a.bis+'T12:00:00');
    while(d <= e){ IDX[a.staff_id][iso(d)] = a; d.setDate(d.getDate()+1); }
  });
}
function aktiveStaff(){ return S.staff.filter(function(m){ return m.aktiv; }); }

// ------------------------------------------------------------------ Rendern
function render(){
  if(!S){ return; }
  if(S.setup){ return renderSetup(); }
  if(!S.angemeldet){ return renderLogin(); }
  var h = '';
  h += '<div class="app">';
  h += '<div class="top">'
     +   '<div><h1>'+esc(S.praxis)+'</h1><div class="sub">Abwesenheiten &amp; Urlaubskonto</div></div>'
     +   '<div class="spacer"></div>'
     +   '<div class="yearpick"><button onclick="jahrWechsel(-1)">&#8249;</button><span>'+JAHR+'</span><button onclick="jahrWechsel(1)">&#8250;</button></div>'
     +   '<button class="iconbtn" onclick="logout()">Abmelden</button>'
     + '</div>';
  var tabs = S.leitung
    ? [['plan','Kalender'],['konten','Urlaub'],['team','Team'],['einst','Einstellungen']]
    : [['plan','Kalender'],['meins','Mein Urlaub']];
  if(tabs.filter(function(t){ return t[0]===VIEW; }).length === 0) VIEW = 'plan';
  h += '<div class="tabs">'+tabs.map(function(t){
    var badge = (t[0]==='plan' && S.leitung && S.offene_antraege) ? '<span class="badge">'+S.offene_antraege+'</span>' : '';
    return '<div class="tab'+(VIEW===t[0]?' on':'')+'" onclick="setView(\''+t[0]+'\')">'+t[1]+badge+'</div>';
  }).join('')+'</div>';
  h += '<div class="wrap">';
  if(MSG) h += '<div id="msg" class="'+(MSG.gut?'ok':'err')+'">'+esc(MSG.text)+'</div>';
  if(VIEW==='plan')        h += viewPlan();
  else if(VIEW==='konten') h += viewKonten();
  else if(VIEW==='team')   h += viewTeam();
  else if(VIEW==='meins')  h += viewMeins();
  else                     h += viewEinst();
  h += '</div>';
  if(VIEW === 'plan' || VIEW === 'konten'){
    h += '<button class="fab noprint" onclick="openEintrag({})">+ '
       + (S.leitung ? 'Eintrag' : 'Urlaub beantragen') + '</button>';
  }
  h += '</div>';
  el('root').innerHTML = h;
}

// ------------------------------------------------------------------ Planer-Zellen
function zelle(m, datum, klass){
  var a = IDX[m.id] && IDX[m.id][datum];
  var inner = '';
  if(a){
    var t = TY[a.typ] || {farbe:'#888', label:a.typ};
    var kurz = t.label.substr(0,1).toUpperCase();
    var blass = / frei\b/.test(klass) ? ';opacity:0.3' : '';
    inner = '<span class="mark'+(a.halbtag?' half':'')+'" style="background:'+t.farbe+blass+'">'+ (a.halbtag?'':kurz) +'</span>'
          + (HATDATEI[a.id] ? '<span class="klammer" title="Nachweis vorhanden"></span>' : '');
  }
  var titel = a ? (TY[a.typ]?TY[a.typ].label:a.typ)+' · '+dmy(a.von)+'–'+dmy(a.bis)+(a.notiz?' · '+a.notiz:'') : dmy(datum);
  return '<td class="d '+klass+'" title="'+esc(titel)+'" onclick="zelleKlick(\''+m.id+'\',\''+datum+'\')">'+inner+'</td>';
}
function zelleKlick(staffId, datum){
  var a = IDX[staffId] && IDX[staffId][datum];
  if(a){ openEintrag(a); return; }
  // Mitarbeiterinnen koennen nur fuer sich selbst etwas eintragen
  if(!S.leitung && staffId !== S.nutzer.staff_id) return;
  openEintrag({staff_id:staffId, von:datum, bis:datum, typ:'urlaub'});
}
function musterKlass(m, d, datum){
  var wd = (d.getDay()+6)%7;
  if(S.feiertage[datum] || wd>=5) return '';
  if(m.eintritt && datum < m.eintritt) return ' frei';
  if(m.austritt && datum > m.austritt) return ' frei';
  var mu = String(m.muster||'1,1,1,1,1,0,0').split(',').map(Number);
  if(!mu[wd]) return ' frei';
  if(mu[wd] === 0.5) return ' halbfrei';
  return '';
}
function tagKlass(d, datum){
  var k = [];
  var wd = (d.getDay()+6)%7;
  if(wd>=5) k.push('we');
  if(S.feiertage[datum]) k.push('ft');
  if(datum===S.heute) k.push('today');
  return k.join(' ');
}
function legende(){
  return '<div class="legend">'+S.typen.map(function(t){
    return '<span class="lg"><i style="background:'+t.farbe+'"></i>'+esc(t.label)+'</span>'; }).join('')
    + '<span class="lg"><i style="background:var(--ft)"></i>Feiertag</span>'
    + '<span class="lg"><i style="background:var(--we)"></i>Wochenende</span>'
    + '<span class="lg"><i style="background:repeating-linear-gradient(135deg,#fff,#fff 2px,#eceff2 2px,#eceff2 4px)"></i>kein Arbeitstag (Teilzeit)</span></div>';
}

// ------------------------------------------------------------------ Ansicht: Kalender
var PLANART = 'monat';   // 'monat' oder 'jahr'
function setPlanart(a){ PLANART = a; render(); }

function viewPlan(){
  var h = heuteStreifen();
  if(S.leitung){ h += antraegeKarte(); h += fehlendeNachweise(); }
  h += '<div style="display:flex;gap:9px;align-items:center;margin-bottom:12px" class="noprint">'
     + '<div class="seg">'
     +   '<button class="'+(PLANART==='monat'?'on':'')+'" onclick="setPlanart(\'monat\')">Monat</button>'
     +   '<button class="'+(PLANART==='jahr'?'on':'')+'" onclick="setPlanart(\'jahr\')">Ganzes Jahr</button>'
     + '</div>'
     + '<div style="flex:1"></div>'
     + '<button class="btn small ghost" onclick="window.print()">Drucken</button></div>';
  h += (PLANART === 'monat') ? viewMonat() : viewJahr();
  return h;
}

function heuteStreifen(){
  var heute = S.heute, staff = aktiveStaff(), abw = [];
  staff.forEach(function(m){
    var a = IDX[m.id] && IDX[m.id][heute];
    if(a) abw.push([m, a]);
  });
  var h = '<div class="heute"><b>Heute, '+dmy(heute)+'</b>';
  if(S.feiertage[heute]) h += '<span class="chip">'+esc(S.feiertage[heute])+'</span>';
  h += '<span>'+(staff.length - abw.length)+' von '+staff.length+' da</span>';
  abw.forEach(function(x){
    var t = TY[x[1].typ] || {farbe:'#888', label:x[1].typ};
    h += '<span class="chip"><i style="background:'+t.farbe+'"></i>'+esc(x[0].name)+' · '+esc(t.label)+'</span>';
  });
  if(!abw.length) h += '<span class="chip">niemand abwesend</span>';
  return h + '</div>';
}

function antraegeKarte(){
  var offen = S.absences.filter(function(a){ return a.status === 'beantragt'; });
  if(!offen.length) return '';
  var h = '<div class="card noprint"><h2>Offene Anträge</h2>';
  offen.forEach(function(a){
    var m = S.staff.filter(function(x){ return x.id === a.staff_id; })[0] || {name:'?'};
    var t = TY[a.typ] || {label:a.typ, farbe:'#888'};
    h += '<div class="antrag">'
      + '<span class="dot" style="background:'+t.farbe+'"></span>'
      + '<div class="t"><b>'+esc(m.name)+'</b> · '+esc(t.label)+'<br>'
      + '<span class="muted">'+zeitraum(a.von,a.bis)+' · '+tage(a.tage)+'</span></div>'
      + '<button class="btn small" onclick="entscheiden(\''+a.id+'\',\'genehmigt\')">Genehmigen</button>'
      + '<button class="btn small ghost" onclick="entscheiden(\''+a.id+'\',\'abgelehnt\')">Ablehnen</button>'
      + '</div>';
  });
  return h + '</div>';
}
/** Krankmeldungen und Fortbildungen, zu denen noch kein Nachweis hinterlegt ist. */
function fehlendeNachweise(){
  var pflicht = {krank:1, kind_krank:1, fortbildung:1};
  var offen = S.absences.filter(function(a){
    return pflicht[a.typ] && !HATDATEI[a.id] && !a.nachweis
        && a.status !== 'abgelehnt' && a.status !== 'storniert' && a.bis <= S.heute;
  }).sort(function(a,b){ return a.von < b.von ? 1 : -1; }).slice(0, 8);
  if(!offen.length) return '';
  var h = '<div class="card noprint"><h2>Nachweis fehlt noch</h2>';
  offen.forEach(function(a){
    var m = S.staff.filter(function(x){ return x.id === a.staff_id; })[0] || {name:'?'};
    var t = TY[a.typ] || {label:a.typ, farbe:'#888'};
    h += '<div class="antrag"><span class="dot" style="background:'+t.farbe+'"></span>'
      + '<div class="t"><b>'+esc(m.name)+'</b> · '+esc(t.label)+'<br>'
      + '<span class="muted">'+zeitraum(a.von,a.bis)+' · '+a.kalendertage+' Kalendertage</span></div>'
      + '<button class="btn small ghost" onclick="openEintragById(\''+a.id+'\')">Nachweis hinzufügen</button></div>';
  });
  return h + '<p class="muted" style="margin-top:8px">Krankenscheine, Atteste und Zertifikate lassen sich '
     + 'direkt am Eintrag hochladen – oder die Mitarbeiterin lädt ihren eigenen hoch.</p></div>';
}
function openEintragById(id){
  var a = S.absences.filter(function(x){ return x.id === id; })[0];
  if(a) openEintrag(a);
}
function entscheiden(id, status){
  api('entscheiden', {id:id, status:status}).then(load)
   .then(function(){ zeige(status === 'genehmigt' ? 'Genehmigt.' : 'Abgelehnt.', true); })
   .catch(function(e){ zeige(fehlerText(e)); });
}

// ------------------------------------------------------------------ Ansicht: Monatsraster
function viewMonat(){
  var staff = aktiveStaff();
  var erster = new Date(JAHR, MONAT, 1), anzahl = new Date(JAHR, MONAT+1, 0).getDate();
  var h = '<div class="card">';
  h += '<div class="noprint" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
     + '<button class="btn small ghost" onclick="monatWechsel(-1)">&#8249; Vorheriger</button>'
     + '<b style="flex:1;text-align:center;font-size:1.05rem">'+MNAME[MONAT]+' '+JAHR+'</b>'
     + '<button class="btn small ghost" onclick="monatWechsel(1)">Nächster &#8250;</button></div>';
  if(!staff.length) return h + '<p class="muted">Noch keine Mitarbeiterinnen angelegt. Im Reiter <b>Team</b> anlegen.</p></div>';

  var kopf = '<tr><th class="nm">Mitarbeiter</th>';
  for(var i=1;i<=anzahl;i++){
    var d = new Date(JAHR, MONAT, i);
    kopf += '<th>'+i+'<br>'+WTAG[(d.getDay()+6)%7]+'</th>';
  }
  kopf += '</tr>';

  var body = '';
  staff.forEach(function(m){
    body += '<tr><th class="nm"><span class="dot" style="display:inline-block;background:'+esc(m.farbe)+'"></span> '+esc(m.name)+'</th>';
    for(var i=1;i<=anzahl;i++){
      var d = new Date(JAHR, MONAT, i), datum = iso(d);
      body += zelle(m, datum, tagKlass(d, datum) + musterKlass(m, d, datum));
    }
    body += '</tr>';
  });
  // Zeile: wie viele sind anwesend
  var sum = '<tr class="sum"><td class="nm" style="position:sticky;left:0;background:#fafbfc;text-align:left;padding-left:10px">anwesend</td>';
  for(var i=1;i<=anzahl;i++){
    var d = new Date(JAHR, MONAT, i), datum = iso(d), wd = (d.getDay()+6)%7;
    if(wd>=5 || S.feiertage[datum]){ sum += '<td>–</td>'; continue; }
    var da = 0, soll = 0;
    staff.forEach(function(m){
      var muster = String(m.muster||'1,1,1,1,1,0,0').split(',').map(Number);
      if(!muster[wd]) return;
      if(m.eintritt && datum < m.eintritt) return;
      if(m.austritt && datum > m.austritt) return;
      soll++;
      if(!(IDX[m.id]&&IDX[m.id][datum])) da++;
    });
    sum += '<td class="'+(soll>0 && da===0 ? 'low' : '')+'">'+da+'/'+soll+'</td>';
  }
  sum += '</tr>';

  h += '<div class="scroll"><table class="plan"><thead>'+kopf+'</thead><tbody>'+body+sum+'</tbody></table></div>';
  h += legende();
  h += '<div class="hilfe">Auf ein Feld tippen legt einen Eintrag an oder öffnet einen vorhandenen. '
     + 'Der grüne Knopf unten rechts geht immer. '
     + (S.leitung ? 'Als Leitung können Sie für jede Person eintragen – auch für Personen ohne eigenen Zugang.' : '') + '</div>';
  return h + '</div>';
}
function monatWechsel(d){
  MONAT += d;
  if(MONAT < 0){ MONAT = 11; JAHR--; return load(); }
  if(MONAT > 11){ MONAT = 0; JAHR++; return load(); }
  render();
}

// ------------------------------------------------------------------ Ansicht: Jahr
function viewJahr(){
  var staff = aktiveStaff();
  var h = '<div class="card"><div class="noprint" style="margin-bottom:12px">'
        + '<b style="font-size:1.05rem">Jahresübersicht '+JAHR+'</b></div>';
  if(!staff.length) return h + '<p class="muted">Noch keine Mitarbeiterinnen angelegt.</p></div>';

  var monKopf = '<tr class="mon-head"><th class="nm"></th>', tagKopf = '<tr><th class="nm">Mitarbeiter</th>';
  for(var mo=0; mo<12; mo++){
    var n = new Date(JAHR, mo+1, 0).getDate();
    monKopf += '<th colspan="'+n+'">'+MKURZ[mo]+'</th>';
    for(var i=1;i<=n;i++){
      var d = new Date(JAHR, mo, i), wd=(d.getDay()+6)%7;
      tagKopf += '<th style="font-size:0.5rem;color:'+(wd>=5?'#aab':'#889')+'">'+i+'</th>';
    }
  }
  monKopf += '</tr>'; tagKopf += '</tr>';

  var body = '';
  staff.forEach(function(m){
    var k = S.konten[m.id] || {};
    body += '<tr><th class="nm">'+esc(m.name)+'<br><span style="font-size:0.6rem;color:var(--mut);font-weight:400">Rest '+num(k.rest||0)+' T.</span></th>';
    for(var mo=0; mo<12; mo++){
      var n = new Date(JAHR, mo+1, 0).getDate();
      for(var i=1;i<=n;i++){
        var d = new Date(JAHR, mo, i), datum = iso(d);
        body += zelleSchmal(m, datum, tagKlass(d, datum) + musterKlass(m, d, datum));
      }
    }
    body += '</tr>';
  });
  h += '<div class="scroll"><table class="plan"><thead>'+monKopf+tagKopf+'</thead><tbody>'+body+'</tbody></table></div>';
  h += legende();
  return h + '</div>';
}
function zelleSchmal(m, datum, klass){
  var a = IDX[m.id] && IDX[m.id][datum];
  var stil = 'width:11px;min-width:11px;height:24px';
  var inner = '';
  if(a){
    var t = TY[a.typ] || {farbe:'#888', label:a.typ};
    inner = '<span class="mark'+(a.halbtag?' half':'')+'" style="background:'+t.farbe+';inset:1px;border-radius:2px'
          + (/ frei\b/.test(klass) ? ';opacity:0.3' : '')+'"></span>';
  }
  var titel = a ? (TY[a.typ]?TY[a.typ].label:a.typ)+' · '+dmy(a.von)+'–'+dmy(a.bis) : dmy(datum);
  return '<td class="d '+klass+'" style="'+stil+'" title="'+esc(titel)+'" onclick="zelleKlick(\''+m.id+'\',\''+datum+'\')">'+inner+'</td>';
}

// ------------------------------------------------------------------ Ansicht: Urlaubskonto
function viewKonten(){
  var h = '<div class="card"><div style="display:flex;gap:8px;margin-bottom:12px" class="noprint">'
        + '<b style="flex:1">Urlaubskonten '+JAHR+'</b>'

  var staff = S.staff.filter(function(m){ return m.aktiv; });

  staff.forEach(function(m){
    var k = S.konten[m.id] || {anspruch:0,uebertrag:0,genommen:0,geplant:0,rest:0,krank:0,kind:0,fortbildung:0};
    var gesamt = Math.max(1, k.anspruch + k.uebertrag);
    h += '<div class="konto">'
      + '<div class="kh"><span class="dot" style="background:'+esc(m.farbe)+'"></span><b>'+esc(m.name)+'</b>'
      + '<span class="muted">'+esc(ROLLEN[m.rolle]||m.rolle)+'</span></div>'
      + '<div class="bar">'
        + '<i style="background:var(--accent);width:'+(k.genommen/gesamt*100)+'%"></i>'

        + kbox(k.anspruch,'Anspruch') + kbox(k.uebertrag,'Übertrag')
        + kbox(k.genommen,'genommen') + kbox(k.geplant,'geplant')
        + '<div class="kbox rest'+(k.rest<0?' neg':'')+'"><div class="v">'+num(k.rest)+'</div><div class="l">Rest</div></div>'
      + '</div>'
      + '<div class="kgrid">'
        + kbox(k.krank,'Krank (AT)') + kbox(k.kind,'Kind krank') + kbox(k.fortbildung,'Fortbildung')
        + kbox(k.sonder||0,'Sonderurlaub')
      + '</div>';
    if(k.krank_12m_kalendertage >= 42){
      h += '<div class="flag"><b>6-Wochen-Grenze erreicht:</b> '+k.krank_12m_kalendertage
         + ' Krankheits-Kalendertage in den letzten 12 Monaten. Entgeltfortzahlung prüfen (EFZG) und BEM anbieten.</div>';
    } else if(k.krank_12m_kalendertage >= 30){
      h += '<div class="flag">'+k.krank_12m_kalendertage+' Krankheitstage in 12 Monaten – 6-Wochen-Grenze (42 Tage) im Blick behalten.</div>';
    }
    if(k.kind >= 15){
      h += '<div class="flag">Kinderkrankentage: '+num(k.kind)+' Tage in '+JAHR+' – gesetzlicher Rahmen (15 je Kind/Elternteil) ausgeschöpft.</div>';
    }
    if(k.rest > 0 && !k.hinweis_am){
      h += '<div class="flag">Noch '+tage(k.rest)+' offen und kein Urlaubs-Hinweis dokumentiert. '
         + '<a href="#" onclick="hinweisText(\''+m.id+'\');return false;"><b>Hinweisschreiben erzeugen</b></a></div>';
    }
    h += '<div class="noprint" style="margin-top:9px">'

    h += '</div>';
  });
  h += '<p class="muted">AT = Arbeitstage nach persönlichem Wochenmuster, Feiertage und Wochenenden sind bereits abgezogen.</p>';

}
function kbox(v, l){ return '<div class="kbox"><div class="v">'+num(v||0)+'</div><div class="l">'+l+'</div></div>'; }

function openKonto(id){

     '<div class="row">'

function hinweisText(id){

  var k = S.konten[id] || {};
  var txt = S.praxis+'\n\n'+'Hinweis zum Urlaubsanspruch '+JAHR+'\n\n'
   + 'Liebe/r '+m.name+',\n\n'
   + 'zum '+dmy(S.heute)+' stehen Dir noch '+num(k.rest)+' Urlaubstage aus dem Jahr '+JAHR+' zu '
   + '(Jahresanspruch '+num(k.anspruch)+' Tage, Übertrag '+num(k.uebertrag)+' Tage, genommen bzw. verplant '
   + num((k.genommen||0)+(k.geplant||0))+' Tage).\n\n'
   + 'Bitte nimm diesen Urlaub bis zum 31.12.'+JAHR+'. Nicht genommener Urlaub verfällt zum 31.12.'+JAHR+' '
   + 'bzw. – soweit eine Übertragung aus dringenden betrieblichen oder persönlichen Gründen vereinbart wurde – '
   + 'zum 31.03.'+(JAHR+1)+'. Bitte stimme Deine Urlaubswünsche rechtzeitig mit der Praxisleitung ab.\n\n'

     });

function vorschlagName(name){
  var titel = ['dr','dr.','prof','prof.','med','med.','dipl','frau','herr'];
  var teile = String(name).toLowerCase().split(/[\s.]+/).filter(function(w){
    return w && titel.indexOf(w) < 0 && titel.indexOf(w+'.') < 0; });
  var w = teile[0] || String(name).toLowerCase();
  return w.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
          .replace(/[^a-z0-9]/g,'');
}

   + '<div><label>Reihenfolge</label><input id="m_sort" type="number" value="'+(m.sortierung||0)+'"></div></div>'

   + '<p class="muted">Teilzeit: nur die tatsächlichen Arbeitstage markieren. Der Urlaubsanspruch wird in <b>Tagen</b> geführt – Faustregel bei Teilzeit: Vollzeittage × (Arbeitstage pro Woche ÷ 5).</p>'
   + (id ? '<button class="btn danger" style="margin-top:14px" onclick="delStaff(\''+id+'\')">Mitarbeiterin löschen</button>' : ''),
     function(){
       var mu = [];
       Array.prototype.forEach.call(document.querySelectorAll('#m_muster button'), function(b){

function musterKlick(b){
  if(b.classList.contains('on')){ b.classList.remove('on'); b.classList.add('half'); }
  else if(b.classList.contains('half')){ b.classList.remove('half'); }
  else { b.classList.add('on'); }
}

// ------------------------------------------------------------------ Eintrag anlegen / ändern
function openEintrag(a){
  a = a || {};
  var istL  = S.leitung;
  var staff = aktiveStaff();
  if(istL && !staff.length){ alert('Bitte zuerst im Reiter Team eine Mitarbeiterin anlegen.'); return; }
  if(!istL && !S.nutzer.staff_id){
    alert('Ihr Zugang ist noch keiner Person im Plan zugeordnet. Bitte die Praxisleitung darum bitten.');
    return;
  }
  var sid = a.staff_id || (istL ? (staff[0] && staff[0].id) : S.nutzer.staff_id);
  var typ = a.typ || 'urlaub';
  var heute = a.von || naechsterArbeitstag(sid);
  var darfLoeschen = a.id && (istL || (a.staff_id === S.nutzer.staff_id && a.status === 'beantragt'));
  var nurLesen = a.id && !istL && !(a.staff_id === S.nutzer.staff_id && a.status === 'beantragt');

  if(nurLesen){
    var m0 = S.staff.filter(function(x){ return x.id === a.staff_id; })[0] || {name:'?'};
    var t0 = TY[a.typ] || {label:a.typ};
    var eigener = a.staff_id === S.nutzer.staff_id;
    var kopf = '<p style="font-size:0.95rem;line-height:1.7"><b>'+esc(m0.name)+'</b><br>'+esc(t0.label)+'<br>'
             + zeitraum(a.von, a.bis)+'</p>';
    if(!eigener){
      dialog('Eintrag', kopf + '<p class="muted">Ändern darf das nur die Praxisleitung.</p>', null);
      return;
    }
    // Eigener Eintrag: Zeitraum unveränderbar, aber Nachweis darf hochgeladen werden
    dialog('Mein Eintrag',
      kopf + nachweisBereich(a, a.typ, false)
      + '<p class="muted">Den Zeitraum ändert die Praxisleitung. Ihren Krankenschein oder das Attest '
      + 'fürs Kind können Sie hier selbst hinzufügen.</p>',
      function(){
        var feld = el('a_datei');
        if(!feld || !feld.files || !feld.files.length) return Promise.resolve();
        var art = el('a_datei_art') ? el('a_datei_art').value : 'sonstiges';
        var kette = Promise.resolve();
        Array.prototype.forEach.call(feld.files, function(d){
          kette = kette.then(function(){ return apiUpload(a.id, art, d); });
        });
        return kette;
      }, 'Nachweis hochladen');
    return;
  }

  // 1. Wer
  var wer = istL
    ? '<div class="row one"><div><label>1. Für wen?</label><select id="a_staff" onchange="personGewechselt()">'
      + staff.map(function(m){
          return '<option value="'+m.id+'"'+(sid===m.id?' selected':'')+'>'+esc(m.name)+'</option>'; }).join('')
      + '</select></div></div>'
    : '<input type="hidden" id="a_staff" value="'+esc(sid)+'">';

  // 2. Was - grosse farbige Schaltflächen statt Auswahlliste
  var arten = S.typen.filter(function(t){ return istL || t.key !== 'geschlossen'; });
  var chips = arten.map(function(t){
    return '<button type="button" class="typ'+(t.key===typ?' on':'')+'" data-typ="'+t.key+'" '
         + 'style="--c:'+t.farbe+'" onclick="typWahl(this)"><i></i>'+esc(t.label)+'</button>';
  }).join('');

  dialog(a.id ? 'Eintrag ändern' : (istL ? 'Neuer Eintrag' : 'Urlaub beantragen'),
     wer
   + '<div class="row one"><div><label>'+(istL?'2. ':'1. ')+'Was?</label>'
   + '<div class="typegrid" id="a_typen">'+chips+'</div>'
   + '<input type="hidden" id="a_typ" value="'+esc(typ)+'"></div></div>'
   + '<div class="row"><div><label>'+(istL?'3. ':'2. ')+'Von</label>'
   + '<input id="a_von" type="date" value="'+esc(a.von||heute)+'" onchange="vonGeaendert()"></div>'
   + '<div><label>Bis</label><input id="a_bis" type="date" value="'+esc(a.bis||a.von||heute)+'" onchange="vorschau()"></div></div>'
   + '<div style="display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap">'
   +   '<button type="button" class="btn small ghost" onclick="spanne(0)">1 Tag</button>'
   +   '<button type="button" class="btn small ghost" onclick="spanne(6)">1 Woche</button>'
   +   '<button type="button" class="btn small ghost" onclick="spanne(13)">2 Wochen</button>'
   +   '<button type="button" class="btn small ghost" onclick="spanne(20)">3 Wochen</button>'
   + '</div>'
   + '<div class="row one"><div><label><input type="checkbox" id="a_halb" '+(a.halbtag?'checked':'')
   + ' onchange="vorschau()" style="width:auto;margin-right:6px">nur ein halber Tag</label></div></div>'
   + '<div class="row one"><div><label>Notiz – freiwillig, keine Diagnosen</label>'
   + '<input id="a_notiz" maxlength="120" value="'+esc(a.notiz||'')+'"></div></div>'
   + nachweisBereich(a, typ, istL)
   + '<div id="a_vorschau" class="ok" style="display:none"></div>'
   + (darfLoeschen ? '<button class="btn danger" onclick="delEintrag(\''+a.id+'\')">Eintrag löschen</button>' : ''),
     function(){
       return api('save_absence', {id:a.id||'', staff_id:el('a_staff').value, typ:el('a_typ').value,
         von:el('a_von').value, bis:el('a_bis').value, halbtag:el('a_halb').checked?1:0,
         notiz:el('a_notiz').value,
         nachweis:(el('a_nachweis') && el('a_nachweis').checked)?1:0,
         status:'genehmigt'})
       .then(function(r){
         // Ausgewählte Nachweise an den (ggf. gerade erst angelegten) Eintrag hängen
         var feld = el('a_datei');
         var ziel = a.id || (r.ids && r.ids[0]);
         if(!feld || !feld.files || !feld.files.length || !ziel) return r;
         var art = el('a_datei_art') ? el('a_datei_art').value : 'sonstiges';
         var kette = Promise.resolve();
         Array.prototype.forEach.call(feld.files, function(datei){
           kette = kette.then(function(){ return apiUpload(ziel, art, datei); });
         });
         return kette;
       });
     },
     istL ? 'Speichern' : 'Antrag senden');
  vorschau();
}
/** Abschnitt "Nachweise" im Eintragsdialog: vorhandene Dateien + Auswahlfeld. */
function nachweisBereich(a, typ, istL){
  var arten = S.nachweis_arten || {};
  var vorgabe = standardArt(typ);
  var liste = a.id ? dateienVon(a.id) : [];
  var h = '<div class="row one"><div><label>Nachweis (Krankenschein, Attest, Zertifikat)</label>';

  liste.forEach(function(f){
    var endung = (f.dateiname.split('.').pop() || '').toUpperCase().substr(0,4);
    h += '<div class="datei"><span class="ic">'+esc(endung||'DAT')+'</span>'
      + '<div class="n"><a href="api.php?a=datei&id='+esc(f.id)+'" target="_blank" rel="noopener">'
      +   esc(f.dateiname)+'</a>'
      + '<span>'+esc(f.art_label)+' · '+mb(f.groesse)+' · '+esc(dmy((f.hochgeladen_am||'').substr(0,10)))+'</span></div>'
      + '<a class="btn small ghost" href="api.php?a=datei&id='+esc(f.id)+'&download=1" '
      +   'style="text-decoration:none">Speichern</a>'
      + '<button type="button" onclick="delDatei(\''+f.id+'\')">Löschen</button></div>';
  });

  h += '<div class="upload">'
    + '<select id="a_datei_art" style="margin-bottom:8px" onchange="this.dataset.handisch=1">'
    + Object.keys(arten).map(function(k){
        return '<option value="'+k+'"'+(k===vorgabe?' selected':'')+'>'+esc(arten[k])+'</option>'; }).join('')
    + '</select>'
    + '<input type="file" id="a_datei" multiple '
    +   'accept="application/pdf,image/jpeg,image/png,image/heic,image/heif,image/webp,.pdf,.jpg,.jpeg,.png,.heic,.heif">'
    + '<p class="muted" style="margin-top:6px">PDF oder Foto, bis '+mb(S.max_upload||10485760)+' je Datei. '
    + 'Mehrere Dateien möglich (z. B. Folgebescheinigung). '
    + (a.id ? 'Wird nach dem Speichern hochgeladen.' : 'Wird zusammen mit dem Eintrag gespeichert.')
    + '</p></div>';

  h += (istL
    ? '<label style="margin-top:9px"><input type="checkbox" id="a_nachweis" '+(a.nachweis?'checked':'')
      + ' style="width:auto;margin-right:6px">Nachweis liegt vor (Haken wird beim Hochladen automatisch gesetzt)</label>'
    : '<input type="hidden" id="a_nachweis" value="">');
  return h + '</div></div>';
}
function delDatei(id){
  if(!confirm('Diesen Nachweis endgültig löschen?')) return;
  api('del_datei', {id:id}).then(function(){ closeDialog(); return load(); })
   .then(function(){ zeige('Nachweis gelöscht.', true); })
   .catch(function(e){ alert(fehlerText(e)); });
}
/** Art des Nachweises automatisch zur gewählten Abwesenheitsart passend setzen. */
function artAnpassen(){
  var sel = el('a_datei_art');
  if(sel && !sel.dataset.handisch) sel.value = standardArt(el('a_typ').value);
}

/** Erster Tag ab heute, an dem diese Person laut Wochenmuster arbeitet. */
function naechsterArbeitstag(staffId){
  var m = S.staff.filter(function(x){ return x.id === staffId; })[0];
  var d = new Date(S.heute+'T12:00:00');
  if(!m) return iso(d);
  var mu = String(m.muster||'1,1,1,1,1,0,0').split(',').map(Number);
  for(var i=0;i<21;i++){
    var datum = iso(d), wd = (d.getDay()+6)%7;
    if(mu[wd] > 0 && !S.feiertage[datum]
       && !(m.eintritt && datum < m.eintritt) && !(m.austritt && datum > m.austritt)) return datum;
    d.setDate(d.getDate()+1);
  }
  return S.heute;
}
/** Wenn eine andere Person gewaehlt wird, den Vorschlag anpassen. */
function personGewechselt(){
  var von = el('a_von'), bis = el('a_bis');
  if(von && bis && von.value === bis.value){
    var neu = naechsterArbeitstag(el('a_staff').value);
    von.value = neu; bis.value = neu;
  }
  vorschau();
}
function typWahl(b){
  Array.prototype.forEach.call(document.querySelectorAll('#a_typen button'), function(x){
    x.classList.remove('on'); });
  b.classList.add('on');
  el('a_typ').value = b.getAttribute('data-typ');
  artAnpassen();
  vorschau();
}
function spanne(plus){
  var v = el('a_von').value || S.heute;
  var d = new Date(v+'T12:00:00'); d.setDate(d.getDate()+plus);
  el('a_von').value = v; el('a_bis').value = iso(d);
  if(plus > 0) el('a_halb').checked = false;
  vorschau();
}
function vonGeaendert(){
  var v = el('a_von').value, b = el('a_bis');
  if(!b.value || b.value < v) b.value = v;
  vorschau();
}
function vorschau(){
  var box = el('a_vorschau'); if(!box) return;
  var sid = el('a_staff').value, typ = el('a_typ').value;
  var von = el('a_von').value, bis = el('a_bis').value || von;
  if(!von || !bis){ box.style.display='none'; return; }
  api('preview', {staff_id:sid, von:von, bis:bis, halbtag:el('a_halb').checked?1:0})
   .then(function(r){
      var txt = '<b>'+num(r.tage)+'</b> '+(r.tage===1?'Arbeitstag':'Arbeitstage')
              + ' · '+r.kalendertage+' '+(r.kalendertage===1?'Kalendertag':'Kalendertage');
      var k = S.konten[sid];
      if(typ === 'urlaub' && k){
        var rest = k.rest - r.tage;
        txt += ' · Resturlaub danach: <b>'+num(rest)+'</b> Tage';
        if(rest < 0) txt += ' &#9888; mehr als der Anspruch';
      }
      if(r.tage === 0) txt += '<br>Hinweis: in diesem Zeitraum wird laut Wochenmuster nicht gearbeitet '
              + '(Wochenende, Feiertag oder freier Tag) – der Eintrag zählt 0 Tage.';
      // Wer ist im selben Zeitraum schon weg?
      var kollegen = [];
      aktiveStaff().forEach(function(m){
        if(m.id === sid) return;
        var d = new Date(von+'T12:00:00'), e = new Date(bis+'T12:00:00');
        while(d <= e){ if(IDX[m.id] && IDX[m.id][iso(d)]){ kollegen.push(m.name); break; } d.setDate(d.getDate()+1); }
      });
      if(kollegen.length) txt += '<br>&#9888; gleichzeitig abwesend: '+esc(kollegen.join(', '));
      box.innerHTML = txt; box.style.display = 'block';
      box.className = (kollegen.length || r.tage === 0 ? 'err' : 'ok');
   }).catch(function(e){ box.className='err'; box.innerHTML = esc(fehlerText(e)); box.style.display='block'; });
}
function delEintrag(id){
  if(!confirm('Eintrag löschen?')) return;
  api('del_absence', {id:id}).then(function(){ closeDialog(); return load(); })
   .then(function(){ zeige('Eintrag gelöscht.', true); })
   .catch(function(e){ alert(fehlerText(e)); });
}

// ------------------------------------------------------------------ Dialog
function dialog(titel, inhalt, onSave, saveLabel){
  closeDialog();
  var d = document.createElement('div');
  d.className = 'ov'; d.id = 'ov';
  d.innerHTML = '<div class="dlg" onclick="event.stopPropagation()"><h3>'+titel+'</h3>'
    + '<div id="dlg_fehler"></div>' + inhalt
    + (onSave ? '<button class="btn" id="dlg_save">'+(saveLabel||'Speichern')+'</button>' : '')
    + '<button class="btn ghost" onclick="closeDialog()">'+(onSave?'Abbrechen':'Schließen')+'</button></div>';
  d.onclick = closeDialog;
  document.body.appendChild(d);
  if(!onSave) return;
  el('dlg_save').onclick = function(){
    el('dlg_save').disabled = true;
    Promise.resolve(onSave()).then(function(){ closeDialog(); return load(); })
      .then(function(){ zeige('Gespeichert.', true); })
      .catch(function(e){
        var b = el('dlg_fehler'); if(b) b.innerHTML = '<div class="err">'+esc(fehlerText(e))+'</div>';
        var s = el('dlg_save'); if(s) s.disabled = false;
      });
  };
}
function closeDialog(){ var o = el('ov'); if(o) o.remove(); }

load();
</script>
</body>
</html>
